name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint, unit test and assemble debug
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon

      - name: Upload lint/test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Upload debug APK (install on a real device without a local build)
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Dump dependency tree (manual license review input)
        if: always()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > dependency-tree.txt

      - name: Upload dependency tree
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-tree
          path: dependency-tree.txt
          retention-days: 14

  security-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Firestore/Storage emulators (Firebase CLI 15+) require JDK 21+; the app itself
      # still targets/builds with JDK 17 (the build-and-test job above) — these are unrelated.
      - name: Set up JDK 21 (emulator runtime only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test harness dependencies
        working-directory: security-rules-tests
        run: npm ci

      - name: SEC-002 — Firestore/Storage rules cross-user-denial tests (emulator)
        run: npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-pdf-reader "npm --prefix security-rules-tests test"
